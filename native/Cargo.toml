[package]
name = "orange-code"
version = "2.0.0"
edition = "2021"
description = "Orange Code - Korean-first native programming language"
license = "MIT"

[[bin]]
name = "orange"
path = "src/main.rs"

[dependencies]
eframe = "0.29"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
